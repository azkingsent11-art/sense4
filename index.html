<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Supercar TRUE Side View - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Tahoma, sans-serif;
    }

    /* ซ่อนปุ่ม VR */
    .a-enter-vr,
    .a-orientation-modal {
      display: none !important;
    }

    #controlPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #statusText {
      color: #fff;
      background: rgba(0,0,0,.72);
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }

    #doorButton {
      pointer-events: auto;
      min-width: 230px;
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      background: #ffcc00;
      color: #111;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,.42);
    }

    #doorButton:disabled {
      opacity: .42;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div id="controlPanel">
  <div id="statusText">กรุณาส่องกล้องไปที่ Hiro Marker</div>
  <button id="doorButton" disabled>เปิดประตูรถ</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="antialias: true; alpha: true; colorManagement: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <a-marker id="hiroMarker" preset="hiro">

    <!--
      สำคัญ:
      rotation="90 0 0"
      = ยกรถขึ้นตั้งฉากกับ Marker
      ดังนั้นกล้องที่มอง Marker จากด้านบนจะเห็น "ด้านข้างรถ" จริง
    -->
    <a-entity id="carRoot"
              position="0 0.42 0"
              rotation="90 0 0"
              scale="0.74 0.74 0.74">

      <!-- ================= BODY ================= -->

      <!-- ตัวถังหลัก -->
      <a-box
        position="0 0.34 0"
        width="2.30"
        height="0.30"
        depth="0.72"
        color="#F4C400"
        material="metalness:0.45; roughness:0.22">
      </a-box>

      <!-- ฝากระโปรงหน้า -->
      <a-box
        position="-0.78 0.47 0"
        width="0.78"
        height="0.18"
        depth="0.67"
        rotation="0 0 -7"
        color="#FFD51A"
        material="metalness:0.38; roughness:0.22">
      </a-box>

      <!-- ท้ายรถ -->
      <a-box
        position="0.76 0.46 0"
        width="0.74"
        height="0.24"
        depth="0.69"
        color="#E5B500">
      </a-box>

      <!-- ห้องโดยสาร -->
      <a-box
        position="0.08 0.67 0"
        width="1.08"
        height="0.34"
        depth="0.60"
        color="#151B20"
        material="metalness:0.18; roughness:0.18">
      </a-box>

      <!-- กระจกหน้า -->
      <a-box
        position="-0.38 0.69 0"
        width="0.45"
        height="0.28"
        depth="0.61"
        rotation="0 0 -21"
        color="#35596C"
        material="opacity:.72; transparent:true">
      </a-box>

      <!-- กระจกหลัง -->
      <a-box
        position="0.52 0.69 0"
        width="0.38"
        height="0.25"
        depth="0.61"
        rotation="0 0 20"
        color="#2F5265"
        material="opacity:.68; transparent:true">
      </a-box>

      <!-- หลังคาคาร์บอน -->
      <a-box
        position="0.08 0.855 0"
        width="0.70"
        height="0.065"
        depth="0.57"
        color="#0E1012"
        material="metalness:.45; roughness:.20">
      </a-box>

      <!-- สเกิร์ตฝั่งที่มองเห็น -->
      <a-box
        position="0 0.18 -0.39"
        width="1.76"
        height="0.075"
        depth="0.06"
        color="#101010">
      </a-box>

      <!-- สเกิร์ตอีกฝั่ง -->
      <a-box
        position="0 0.18 0.39"
        width="1.76"
        height="0.075"
        depth="0.06"
        color="#101010">
      </a-box>

      <!-- Splitter -->
      <a-box
        position="-1.12 0.18 0"
        width="0.14"
        height="0.07"
        depth="0.78"
        color="#0B0B0B">
      </a-box>

      <!-- Diffuser -->
      <a-box
        position="1.12 0.18 0"
        width="0.14"
        height="0.09"
        depth="0.78"
        color="#0B0B0B">
      </a-box>

      <!-- ช่องลมข้างฝั่งที่เห็น -->
      <a-box
        position="0.47 0.37 -0.375"
        width="0.36"
        height="0.18"
        depth="0.022"
        rotation="0 0 -9"
        color="#050505">
      </a-box>

      <!-- ไฟหน้า -->
      <a-box
        position="-1.02 0.48 -0.34"
        width="0.27"
        height="0.055"
        depth="0.04"
        color="#F4FCFF"
        material="emissive:#DDF7FF; emissiveIntensity:1.3">
      </a-box>

      <!-- ไฟท้าย -->
      <a-box
        position="1.085 0.47 -0.33"
        width="0.05"
        height="0.075"
        depth="0.28"
        color="#D30000"
        material="emissive:#B00000; emissiveIntensity:1">
      </a-box>

      <!-- ================= WHEELS ================= -->

      <!-- ล้อหน้า ฝั่งที่เห็น -->
      <a-cylinder
        position="-0.72 0.245 -0.405"
        radius="0.275"
        height="0.15"
        rotation="90 0 0"
        color="#070707">
      </a-cylinder>

      <a-cylinder
        position="-0.72 0.245 -0.485"
        radius="0.165"
        height="0.035"
        rotation="90 0 0"
        color="#A8ADB2"
        material="metalness:.85; roughness:.18">
      </a-cylinder>

      <a-cylinder
        position="-0.72 0.245 -0.51"
        radius="0.070"
        height="0.02"
        rotation="90 0 0"
        color="#F4C400">
      </a-cylinder>

      <!-- ล้อหลัง ฝั่งที่เห็น -->
      <a-cylinder
        position="0.76 0.245 -0.405"
        radius="0.295"
        height="0.16"
        rotation="90 0 0"
        color="#070707">
      </a-cylinder>

      <a-cylinder
        position="0.76 0.245 -0.49"
        radius="0.177"
        height="0.035"
        rotation="90 0 0"
        color="#A8ADB2"
        material="metalness:.85; roughness:.18">
      </a-cylinder>

      <a-cylinder
        position="0.76 0.245 -0.515"
        radius="0.073"
        height="0.02"
        rotation="90 0 0"
        color="#F4C400">
      </a-cylinder>

      <!-- ล้ออีกฝั่ง -->
      <a-cylinder position="-0.72 0.245 0.405"
                  radius="0.275" height="0.15"
                  rotation="90 0 0" color="#070707">
      </a-cylinder>

      <a-cylinder position="0.76 0.245 0.405"
                  radius="0.295" height="0.16"
                  rotation="90 0 0" color="#070707">
      </a-cylinder>

      <!-- ================= REAR WING ================= -->

      <a-box
        position="0.83 0.75 0"
        width="0.07"
        height="0.34"
        depth="0.07"
        color="#111">
      </a-box>

      <a-box
        position="0.83 0.92 0"
        width="0.48"
        height="0.06"
        depth="0.88"
        color="#111">
      </a-box>

      <!-- ================= VISIBLE SCISSOR DOOR ================= -->

      <!--
        ฝั่ง z = - คือฝั่งที่หันเข้ากล้อง
        เมื่อ carRoot ถูกหมุน +90 องศา
      -->
      <a-entity id="visibleDoorPivot"
                position="-0.23 0.57 -0.405"
                rotation="0 0 0">

        <!-- ประตู -->
        <a-box
          position="0.34 0 0"
          width="0.70"
          height="0.42"
          depth="0.075"
          color="#FFD51A"
          material="metalness:.42; roughness:.20">
        </a-box>

        <!-- กระจกประตู -->
        <a-box
          position="0.29 0.17 -0.004"
          width="0.48"
          height="0.18"
          depth="0.08"
          color="#294B5C"
          material="opacity:.70; transparent:true">
        </a-box>

        <!-- ลายดำ -->
        <a-box
          position="0.40 -0.11 -0.043"
          width="0.34"
          height="0.05"
          depth="0.018"
          color="#0A0A0A">
        </a-box>

        <!-- มือจับ -->
        <a-box
          position="0.46 0.03 -0.047"
          width="0.12"
          height="0.025"
          depth="0.015"
          color="#242424">
        </a-box>
      </a-entity>

      <!-- ประตูอีกฝั่ง -->
      <a-entity id="farDoorPivot"
                position="-0.23 0.57 0.405"
                rotation="0 0 0">

        <a-box
          position="0.34 0 0"
          width="0.70"
          height="0.42"
          depth="0.075"
          color="#F0BC00">
        </a-box>

        <a-box
          position="0.29 0.17 0.004"
          width="0.48"
          height="0.18"
          depth="0.08"
          color="#294B5C"
          material="opacity:.60; transparent:true">
        </a-box>
      </a-entity>

      <!-- กระจกมองข้าง -->
      <a-box
        position="-0.27 0.67 -0.48"
        width="0.19"
        height="0.075"
        depth="0.11"
        color="#F4C400">
      </a-box>

      <!-- ท่อไอเสีย -->
      <a-cylinder
        position="1.17 0.23 -0.18"
        radius="0.055"
        height="0.11"
        rotation="0 0 90"
        color="#777">
      </a-cylinder>

      <a-cylinder
        position="1.17 0.23 0.18"
        radius="0.055"
        height="0.11"
        rotation="0 0 90"
        color="#777">
      </a-cylinder>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const marker = document.getElementById("hiroMarker");
  const button = document.getElementById("doorButton");
  const statusText = document.getElementById("statusText");

  const visibleDoor = document.getElementById("visibleDoorPivot");
  const farDoor = document.getElementById("farDoorPivot");

  let markerVisible = false;
  let doorsOpen = false;

  marker.addEventListener("markerFound", () => {
    markerVisible = true;
    button.disabled = false;
    statusText.textContent = "พบ Hiro Marker แล้ว ✓";
  });

  marker.addEventListener("markerLost", () => {
    markerVisible = false;
    button.disabled = true;
    statusText.textContent = "กรุณาส่องกล้องไปที่ Hiro Marker";
  });

  button.addEventListener("click", () => {
    if (!markerVisible) return;

    doorsOpen = !doorsOpen;

    visibleDoor.removeAttribute("animation__door");
    farDoor.removeAttribute("animation__door");

    if (doorsOpen) {

      /*
        ประตูฝั่งที่เห็น:
        หมุนใน local Z ของรถ
        ทำให้ในมุม side view เห็นยกขึ้นเหมือน scissor door ชัดเจน
      */
      visibleDoor.setAttribute(
        "animation__door",
        "property: rotation; to: 0 0 78; dur: 900; easing: easeInOutCubic"
      );

      farDoor.setAttribute(
        "animation__door",
        "property: rotation; to: 0 0 -65; dur: 900; easing: easeInOutCubic"
      );

      button.textContent = "ปิดประตูรถ";
      statusText.textContent = "ประตู Scissor Door เปิดอยู่";

    } else {

      visibleDoor.setAttribute(
        "animation__door",
        "property: rotation; to: 0 0 0; dur: 900; easing: easeInOutCubic"
      );

      farDoor.setAttribute(
        "animation__door",
        "property: rotation; to: 0 0 0; dur: 900; easing: easeInOutCubic"
      );

      button.textContent = "เปิดประตูรถ";
      statusText.textContent = "ประตูรถปิดอยู่";
    }
  });
});
</script>

</body>
</html>
